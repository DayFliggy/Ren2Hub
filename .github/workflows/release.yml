name: Ren2Hub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GOWORK: 'off'
  CGO_ENABLED: '0'
  GOOS: linux
  GOARCH: amd64

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Determine Version
        run: |
          node scripts/build-version.mjs --github-env
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build
          bun ../scripts/prepare-frontend-embed.mjs
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build and package linux/amd64
        run: |
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/MoeForge/moejs)/default.pgo" \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -X 'github.com/QuantumNous/new-api/common.BuildType=release'" -o ren2hub .
          archive="ren2hub_${VERSION#v}_linux_amd64.tar.gz"
          tar -czf "$archive" ren2hub LICENSE NOTICE THIRD-PARTY-LICENSES.md
          sha256sum "$archive" > checksums.txt
      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          fail_on_unmatched_files: true
          files: |
            ren2hub_*_linux_amd64.tar.gz
            checksums.txt
