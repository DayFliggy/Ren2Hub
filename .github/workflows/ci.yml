name: Local test contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.9'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
      - name: Prepare dependencies explicitly
        run: |
          (cd frontend && bun install --frozen-lockfile)
          go mod download
          (cd relaykit && GOWORK=off go mod download)
          (cd tokenkit && GOWORK=off go mod download)
          docker pull mysql:8.4
          docker pull postgres:15.19
      - name: Runner safety contracts
        run: python3 -B -m unittest discover -s scripts/testing -p 'test_*.py'
      - name: Native Go and Vue contracts
        run: python3 -B scripts/testing/run.py unit
      - name: Fresh database matrix
        run: python3 -B scripts/testing/run.py databases
      - name: Static checks
        run: python3 -B scripts/testing/run.py static
      - name: Production build and embedded assets
        run: python3 -B scripts/testing/run.py build
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-test-evidence
          path: .local-tests/
          include-hidden-files: true
          if-no-files-found: error
